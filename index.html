<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lift Gate: a rigging safety platformer. Nine lift gates, one rigging rule each.">
<title>Lift Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Saira+Stencil+One&display=swap">
<style>
  :root {
    --bg: #0f141a;
    --panel: #18202a;
    --panel-2: #1f2934;
    --line: #2f3b48;
    --ink: #e8ecef;
    --muted: #93a1ae;
    --safety: #f5b800;
    --hivis: #ff7a1a;
    --ok: #43b86b;
    --bad: #e5534b;
    --display: "Saira Stencil One", Impact, "Arial Black", sans-serif;
    --body: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { height: 100%; box-sizing: border-box; background: var(--bg); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-block: 10px;
    padding-inline: 16px;
    overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-size: 22px; color: var(--safety); letter-spacing: .04em; line-height: 1; }
  .spacer { flex: 1; }
  .chip {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip b { color: var(--ink); font-weight: 700; }
  button.chip { background: transparent; font-family: var(--body); cursor: pointer; }
  button.chip:hover { border-color: var(--safety); }
  button.chip:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
  button.chip[aria-pressed="true"] b { color: var(--bad); }
  .rotate { display: none; font-size: 12px; color: var(--muted); }
  @media (orientation: portrait) { body.touch .rotate { display: block; } }

  #wrap { position: relative; flex: 1; min-height: 0; background: #0b1016; border-radius: 4px; overflow: hidden; }
  #game { position: absolute; inset: 0; }
  #game canvas { touch-action: none; display: block; }

  /* Touch controls */
  #touch { display: none; position: absolute; inset: auto 0 0 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); justify-content: space-between; align-items: end; pointer-events: none; z-index: 5; }
  body.touch #touch { display: flex; }
  #touch .pad { display: flex; gap: 10px; pointer-events: auto; }
  #touch button {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(245, 184, 0, .7); background: rgba(15, 20, 26, .55);
    color: var(--safety); font: 700 13px var(--body); letter-spacing: .06em;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    display: grid; place-items: center;
  }
  #touch button.on { background: rgba(245, 184, 0, .35); }
  #touch button.jump { width: 76px; height: 76px; }

  /* Overlays */
  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; overflow: auto; padding: 12px; background: rgba(8, 11, 15, .74); }
  .card {
    margin: auto; width: 100%; max-width: 760px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 20px 18px; position: relative;
  }
  .card::before {
    content: ""; display: block; height: 8px; margin: 0 -20px 16px;
    background: repeating-linear-gradient(-45deg, var(--safety) 0 12px, #14181d 12px 24px);
    border-radius: 3px 3px 0 0;
  }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--safety); font-weight: 700; }
  .eyebrow.bad { color: var(--bad); }
  .eyebrow.ok { color: var(--ok); }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 4px 0 10px; line-height: 1.05; text-wrap: balance; letter-spacing: .02em; }
  h1 { font-size: clamp(40px, 8vw, 72px); color: var(--safety); }
  h2 { font-size: clamp(24px, 4vw, 34px); }
  p { margin: 0 0 10px; max-width: 62ch; }
  .muted { color: var(--muted); }
  .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  .loadrow { display: grid; grid-template-columns: 1.2fr .6fr 2fr; gap: 12px; padding: 10px 12px; background: var(--panel-2); border-radius: 3px; margin-bottom: 10px; }
  .loadrow b { font-weight: 700; }
  .loadrow .wt { font-family: var(--display); font-size: 22px; color: var(--safety); font-weight: 400; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .loadrow { grid-template-columns: 1fr 1fr; } .loadrow .rig { grid-column: 1 / -1; } }

  .rule { border-left: 3px solid var(--safety); padding-left: 10px; }
  .rule span { font-weight: 700; color: var(--safety); text-transform: uppercase; font-size: 12px; letter-spacing: .1em; margin-right: 6px; }
  .factors { width: 100%; max-width: 420px; border-collapse: collapse; font-size: 13px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .factors th, .factors td { border: 1px solid var(--line); padding: 4px 8px; text-align: center; }
  .factors th { color: var(--muted); font-weight: 500; text-align: left; }

  form { display: flex; flex-direction: column; gap: 10px; }
  fieldset { border: 0; margin: 0; padding: 0; }
  legend { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin-bottom: 6px; padding: 0; }
  .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .opt {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 9px 10px; border: 2px solid var(--line); border-radius: 4px; background: var(--panel-2);
    cursor: pointer; min-height: 58px; transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: #4a5a6b; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt:has(input:checked) { border-color: var(--safety); background: #2a2a1f; }
  .opt:has(input:focus-visible) { outline: 2px solid var(--hivis); outline-offset: 2px; }
  .ol { font-weight: 700; font-size: 14px; }
  .os { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 26px; height: 6px; border-radius: 3px; margin-bottom: 4px; }
  .opt svg { width: 64px; height: 42px; color: var(--ink); margin-bottom: 2px; }

  .btn {
    font: 700 15px var(--body); letter-spacing: .06em; text-transform: uppercase;
    padding: 12px 20px; border-radius: 3px; border: 2px solid var(--safety); cursor: pointer;
    background: transparent; color: var(--safety); align-self: flex-start;
  }
  .btn.primary { background: var(--safety); color: #14181d; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--hivis); outline-offset: 3px; }

  .why { font-size: 17px; }
  .correct { background: var(--panel-2); border-radius: 3px; padding: 10px 12px; margin-bottom: 14px; }
  .correct ul { margin: 4px 0 0; padding-left: 18px; }
  .keys { display: flex; flex-wrap: wrap; gap: 16px; margin: 6px 0 16px; font-size: 13px; color: var(--muted); }
  kbd { font: 700 12px var(--body); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 3px; padding: 1px 6px; color: var(--ink); background: var(--panel-2); }

  .cert { text-align: left; }
  .cert .seal {
    width: 88px; height: 88px; border-radius: 50%; border: 3px dashed var(--safety);
    display: grid; place-items: center; font-family: var(--display); color: var(--safety); font-size: 26px;
    float: right; margin: 0 0 8px 12px; transform: rotate(-8deg);
  }
  .rules { list-style: none; padding: 0; margin: 0 0 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 16px; }
  .rules li { display: flex; gap: 8px; }
  .rules .tick { color: var(--ok); font-weight: 700; }
  .rules .miss { color: var(--muted); font-weight: 700; }
  .score-big { font-family: var(--display); font-size: 40px; color: var(--ink); font-variant-numeric: tabular-nums; }

  @media (max-width: 480px), (max-height: 420px) {
    .card { padding: 0 14px 14px; }
    .card::before { margin: 0 -14px 12px; }
    .opt { padding: 7px 8px; min-height: 50px; }
    .ol { font-size: 13px; }
    .os { font-size: 11.5px; }
    .opt svg { width: 52px; height: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { .opt { transition: none; } }
</style>
</head>
<body>


<header>
  <div class="brand">LIFT GATE</div>
  <div class="spacer"></div>
  <div class="chip" id="hudLevel">Level <b>1</b>/9</div>
  <div class="chip">Score <b id="hudScore">0</b></div>
  <button class="chip mute" id="muteBtn" aria-pressed="false" title="Mute or unmute (M)">Sound <b>on</b></button>
</header>
<div class="rotate">Turn your phone sideways for a bigger view.</div>

<div id="wrap">
  <div id="game"></div>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button id="tLeft" aria-label="Move left"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M15 3 5 11l10 8z" fill="currentColor"/></svg></button>
      <button id="tRight" aria-label="Move right"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M7 3l10 8-10 8z" fill="currentColor"/></svg></button>
    </div>
    <div class="pad">
      <button id="tJump" class="jump" aria-label="Jump">JUMP</button>
    </div>
  </div>

  <div class="overlay" id="panel" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>

/* ---------- 2b. SOUND (Web Audio, made in code — no sound files) ---------- */
const SFX = {
  ctx: null, master: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.35;
    this.master.connect(this.ctx.destination);
  },
  ok() { return this.ctx && !this.muted; },
  tone(freq, dur, { type = 'square', to = null, vol = 0.2, delay = 0 } = {}) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, { vol = 0.6, freq = 900, delay = 0 } = {}) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = buf;
    f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  },
  motor(dur) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(48, t); o.frequency.linearRampToValueAtTime(62, t + 0.4);
    o.frequency.setValueAtTime(62, t + dur - 0.3); o.frequency.linearRampToValueAtTime(44, t + dur);
    f.type = 'lowpass'; f.frequency.value = 380;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.15);
    g.gain.setValueAtTime(0.14, t + dur - 0.25); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f).connect(g).connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  jump() { this.tone(300, 0.14, { to: 620, vol: 0.12 }); },
  fall() { this.tone(420, 0.35, { to: 110, vol: 0.12 }); },
  whistle() { this.tone(1500, 0.4, { type: 'sine', to: 260, vol: 0.18 }); },
  crunch() { this.noise(0.5, { vol: 0.9, freq: 1200 }); this.tone(95, 0.4, { to: 38, vol: 0.3 }); this.noise(0.25, { vol: 0.4, freq: 3000, delay: 0.08 }); },
  clack() { this.tone(180, 0.07, { vol: 0.15 }); this.tone(140, 0.07, { vol: 0.12, delay: 0.09 }); },
  ding() { this.tone(880, 0.6, { type: 'sine', vol: 0.25 }); this.tone(1320, 0.7, { type: 'sine', vol: 0.14, delay: 0.09 }); },
  jingle() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.16, { vol: 0.12, delay: i * 0.12 })); this.tone(1047, 0.45, { vol: 0.12, delay: 0.36 }); },
  fanfare() {
    [392, 523, 659, 784, 659, 784].forEach((f, i) => this.tone(f, 0.18, { vol: 0.12, delay: i * 0.13 }));
    this.tone(1047, 0.8, { vol: 0.13, delay: 0.8 }); this.tone(784, 0.8, { type: 'triangle', vol: 0.12, delay: 0.8 });
  },
  toggle() {
    this.muted = !this.muted;
    const b = $('muteBtn');
    b.setAttribute('aria-pressed', String(this.muted));
    b.innerHTML = `Sound <b>${this.muted ? 'off' : 'on'}</b>`;
  },
};

/* ---------- 3. UI (DOM) ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rigSvg({ legs, deg }) {
  const hx = 32, hy = 6, len = 30, r = (deg * Math.PI) / 180;
  const dx = Math.sin(r) * len, dy = Math.cos(r) * len;
  let lines, box;
  if (legs === 1) {
    lines = `<line x1="${hx}" y1="${hy}" x2="${hx + dx}" y2="${hy + dy}"/>`;
    box = `<rect x="${hx + dx - 12}" y="${hy + dy}" width="24" height="7" rx="1"/>`;
  } else {
    lines = `<line x1="${hx}" y1="${hy}" x2="${hx - dx}" y2="${hy + dy}"/><line x1="${hx}" y1="${hy}" x2="${hx + dx}" y2="${hy + dy}"/>`;
    box = `<rect x="${hx - dx - 3}" y="${hy + dy}" width="${2 * dx + 6}" height="7" rx="1"/>`;
  }
  return `<svg viewBox="0 0 64 46" aria-hidden="true"><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none">${lines}</g><circle cx="${hx}" cy="${hy}" r="3.5" fill="#f5b800"/><g fill="currentColor" opacity=".55">${box}</g></svg>`;
}

    this.open(`
      <div class="card">

/* ---------- 4. TEXTURES (original shape art) ---------- */
function makeTextures(s) {
  if (s.textures.exists('r_idle')) return;
  const g = s.make.graphics({ x: 0, y: 0, add: false });
  const C = Phaser.Display.Color;
  const dark = (c, n) => C.ValueToColor(c).darken(n).color;
  const light = (c, n) => C.ValueToColor(c).lighten(n).color;

  // Rigger: hi-vis vest, white hard hat. Faces right.
  const rigger = (key, pose) => {
    g.clear();
    const legs = { idle: [[9, 33, 9], [16, 33, 9]], r1: [[5, 33, 9], [19, 33, 9]], r2: [[11, 33, 9], [14, 33, 9]], jump: [[6, 31, 8], [18, 33, 7]] }[pose];
    const armBack = pose === 'r2';

/* ---------- 5. SCENE ---------- */
class YardScene extends Phaser.Scene {
  constructor() { super('yard'); }

  init(d) {
    this.li = d && d.level != null ? d.level : S.level;
    this.L = LEVELS[this.li];
    this.solved = false; this.busy = false; this.attempts = 0;
    this.attached = false; this.snapped = false; this.good = false; this.cogShift = 0;
    this.coyote = 0; this.jumpBuf = 0;
  }

  create() {
    makeTextures(this);
    const L = this.L, gx = L.gateX, W = gx + 1000;
    this.W = W;
    this.physics.world.setBounds(0, -200, W, 900);
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.cameras.main.setBounds(0, 0, W, 540);

    // Backdrop
    const sky = this.add.graphics().setScrollFactor(0).setDepth(-10);
    sky.fillGradientStyle(0x0d1620, 0x0d1620, 0x3a3342, 0x3a3342, 1);
    sky.fillRect(0, 0, 960, 540);
    for (let x = 0; x < W * 0.25 + 960; x += 960) this.add.image(x, GY + 6, 'far').setOrigin(0, 1).setScrollFactor(0.25).setDepth(-9);
    for (let x = 0; x < W * 0.55 + 960; x += 960) this.add.image(x, GY + 6, 'mid').setOrigin(0, 1).setScrollFactor(0.55).setDepth(-8);
    this.add.rectangle(0, 522, W, 18, 0x080b0f).setOrigin(0).setDepth(1);

    // Ground and platforms
    this.solids = []; this.oneway = [];
    this.segments = L.ground.map(([a, b]) => [a, Math.min(b, W)]);
    this.segments.forEach(([a, b]) => {
      const t = this.add.tileSprite(a, GY, b - a, 60, 'ground').setOrigin(0, 0).setDepth(5);
      this.physics.add.existing(t, true); this.solids.push(t);
    });
    L.blocks.forEach((bk) => {
      if (bk.t === 'c') {
        for (let i = 0; i < bk.h; i++) {
          const img = this.add.image(bk.x, GY - 64 * (i + 1), 'cont' + bk.c).setOrigin(0, 0).setDepth(4);
          this.physics.add.existing(img, true); this.solids.push(img);
        }
      } else {
        const img = this.add.image(bk.x, bk.y, 'beam').setOrigin(0, 0).setDepth(4);
        this.physics.add.existing(img, true);
        img.body.checkCollision.down = false; img.body.checkCollision.left = false; img.body.checkCollision.right = false;
        this.oneway.push(img);
      }
    });

    // Signs
    this.sign(70, 330, `LEVEL ${L.id} · ${L.title.toUpperCase()}`, '#f5b800', '#14181d');
    this.sign(gx - 470, 380, 'LIFT ZONE AHEAD', '#f5b800', '#14181d');
    this.sign(W - 200, 380, 'SITE EXIT  →', '#2f8f4e', '#ffffff');

    // Crane (static), truck, boom gate
    this.buildCrane(gx);
    this.buildTruck(gx);
    const post = this.add.graphics().setDepth(6);
    post.fillStyle(0x3b4048); post.fillRect(gx - 176, GY - 90, 14, 90);
    post.fillStyle(0xf5b800); post.fillRect(gx - 180, GY - 96, 22, 10);
    this.arm = this.add.image(gx - 169, GY - 80, 'boom').setOrigin(0, 0.5).setDepth(6);

    // Load
    this.loadC = this.add.container(gx, GY).setDepth(8);
    const limg = this.add.image(0, 0, L.load.key).setOrigin(0.5, 1);
    const tag = this.add.text(0, -L.load.h / 2, L.load.weight, {
      fontFamily: '"Saira Stencil One", Impact, sans-serif', fontSize: '20px', color: '#f5b800',
      backgroundColor: '#14181dcc', padding: { x: 6, y: 2 },
    }).setOrigin(0.5);
    this.loadC.add([limg, tag]);

    // Hook and rope (redrawn each frame)
    this.crane = { tx: gx, hy: 190 };
    this.hookG = this.add.graphics().setDepth(9);

    // Player
    this.player = this.physics.add.sprite(80, GY - 60, 'r_idle').setDepth(10);
    this.player.body.setSize(16, 42).setOffset(7, 4);
    this.player.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.solids);
    this.physics.add.collider(this.player, this.oneway);

    // Gate wall, trigger, exit
    this.wall = this.add.zone(gx - 150, -200, 24, GY + 200).setOrigin(0, 0);
    this.physics.add.existing(this.wall, true);
    this.physics.add.collider(this.player, this.wall);
    const trig = this.add.zone(gx - 340, GY - 220, 190, 220).setOrigin(0, 0);
    this.physics.add.existing(trig, true);
    this.physics.add.overlap(this.player, trig, () => this.onGate());
    const exit = this.add.zone(W - 120, GY - 220, 60, 220).setOrigin(0, 0);
    this.physics.add.existing(exit, true);
    this.physics.add.overlap(this.player, exit, () => this.onExit());

    // Camera and keys
    const cam = this.cameras.main;
    cam.startFollow(this.player, true, 0.12, 0.12);
    cam.setFollowOffset(-140, 0);
    this.keys = this.input.keyboard.addKeys({ left: 'LEFT', right: 'RIGHT', up: 'UP', space: 'SPACE', a: 'A', d: 'D', w: 'W' });

    this.setUiOpen(S.mode !== 'play');
    UI.hud();
  }

  sign(x, y, text, bg, fg) {
    const g = this.add.graphics().setDepth(2);
    g.fillStyle(0x3b4048); g.fillRect(x + 20, y, 6, GY - y);
    this.add.text(x, y - 34, text, {
      fontFamily: '"Saira Stencil One", Impact, sans-serif', fontSize: '18px', color: fg,
      backgroundColor: bg, padding: { x: 10, y: 6 },
    }).setDepth(2);
  }

  buildCrane(gx) {
    const c = this.add.graphics().setDepth(1);
    const m = gx + 760, top = 80, j0 = gx - 220, j1 = m + 140;
    c.lineStyle(3, 0xf5b800);
    c.lineBetween(m - 12, top, m - 12, GY); c.lineBetween(m + 12, top, m + 12, GY);
    for (let y = top + 16; y < GY; y += 24) { c.lineBetween(m - 12, y, m + 12, y + 24); c.lineBetween(m - 12, y + 24, m + 12, y + 24); }
    c.lineBetween(j0, top, j1, top); c.lineBetween(j0, top + 16, j1, top + 16);
    for (let x = j0; x < j1; x += 20) { c.lineBetween(x, top + 16, x + 10, top); c.lineBetween(x + 10, top, x + 20, top + 16); }
    c.lineBetween(m - 8, top, m, top - 50); c.lineBetween(m + 8, top, m, top - 50);
    c.lineStyle(1.5, 0x9aa7b4);
    c.lineBetween(m, top - 50, j0 + 140, top); c.lineBetween(m, top - 50, j1 - 10, top);
    c.fillStyle(0x6b7078); c.fillRect(m + 70, top + 16, 60, 34);
    c.fillStyle(0xf5b800); c.fillRect(m - 42, top + 16, 30, 26);
    c.fillStyle(0x9fc3d9); c.fillRect(m - 38, top + 20, 16, 12);
    c.fillStyle(0x3b4048); c.fillRect(m - 30, GY - 16, 60, 16);
  }

  buildTruck(gx) {
    const t = this.add.graphics().setDepth(2);
    const a = gx + 290, b = gx + 560;
    t.fillStyle(0x2c3137); t.fillRect(a, 440, b - a, 14);
    t.fillStyle(0x3b4048); t.fillRect(a, 454, b - a, 6);
    t.fillStyle(0x2d5c9e); t.fillRoundedRect(b + 4, 392, 72, 64, 6);
    t.fillStyle(0x9fc3d9); t.fillRect(b + 42, 400, 26, 20);
    t.fillStyle(0xf5b800); t.fillRect(b + 20, 386, 16, 6);
    [a + 40, a + 76, b - 50, b + 44].forEach((x) => {
      t.fillStyle(0x151a1f); t.fillCircle(x, 466, 14);
      t.fillStyle(0x6b7078); t.fillCircle(x, 466, 5);
    });
  }

  setUiOpen(open) {
    const kb = this.input.keyboard;
    if (!kb) return;
    if (open) kb.disableGlobalCapture(); else kb.enableGlobalCapture();
    kb.resetKeys();
  }

  tw(cfg) { return new Promise((r) => this.tweens.add({ ...cfg, onComplete: () => r() })); }
  wait(ms) { return new Promise((r) => this.time.delayedCall(ms, r)); }

  float(x, y, text, color) {
    const t = this.add.text(x, y, text, {
      fontFamily: '"Saira Stencil One", Impact, sans-serif', fontSize: '28px', color,
      stroke: '#0f141a', strokeThickness: 6,
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 1400, ease: 'Quad.easeOut', onComplete: () => t.destroy() });
  }

  /* --- Gate flow --- */
  onGate() {
    if (S.mode !== 'play' || this.solved || this.busy) return;
    S.mode = 'quiz';
    this.physics.pause();
    this.player.anims.stop(); this.player.setTexture('r_idle');
    UI.quiz(this.L, (a) => this.resolve(a));
  }

  async resolve(ans) {
    if (this.busy) return;
    this.busy = true;
    UI.close();
    this.snapped = false; this.good = false; this.cogShift = 0;
    const L = this.L;
    const wrong = L.groups.find((g) => ans[g.id] !== g.correct);
    if (!wrong) {
      const first = this.attempts === 0;
      if (first) S.score += 100;
      S.firstTry[this.li] = first;
      UI.hud();
      await this.liftLoad();
      this.solved = true;
      this.float(this.player.x, this.player.y - 40, first ? '+100' : 'GATE OPEN', first ? '#43b86b' : '#f5b800');
      this.busy = false;
      S.mode = 'play';
      this.physics.resume();
      this.setUiOpen(false);
    } else {
      this.attempts++;
      const word = ['CRUNCH!', 'KA-BLAM!', 'THUD!'][(this.attempts - 1) % 3];
      await this.dropLoad(word);
      this.busy = false;
      const opt = wrong.options.find((o) => o.id === ans[wrong.id]);
      UI.fail(L, opt.why, word, () => UI.quiz(L, (a) => this.resolve(a)));
    }
  }

  async liftLoad() {
    const L = this.L, h = L.load.h, c = this.crane, gx = L.gateX;
    const attachHy = GY - h - SL - 30;
    this.good = true;
    SFX.motor(5.6);
    if (L.load.cog) {
      this.cogShift = L.load.cog;
      await this.tw({ targets: c, tx: gx + L.load.cog, duration: 350, ease: 'Sine.easeInOut' });
    }
    await this.tw({ targets: c, hy: attachHy, duration: 650, ease: 'Sine.easeInOut' });
    SFX.clack();
    this.attached = true;
    await this.tw({ targets: c, hy: 120, duration: 1100, ease: 'Sine.easeInOut' });
    await this.tw({ targets: c, tx: gx + 425 + this.cogShift, duration: 1500, ease: 'Sine.easeInOut' });
    await this.tw({ targets: c, hy: 440 - h - SL - 30, duration: 900, ease: 'Sine.easeInOut' });
    SFX.clack();
    this.attached = false;
    await this.tw({ targets: c, hy: 190, duration: 500, ease: 'Sine.easeOut' });
    this.wall.body.enable = false;
    SFX.ding();
    await this.tw({ targets: this.arm, angle: -85, duration: 600, ease: 'Back.easeOut' });
  }

  async dropLoad(word) {
    const L = this.L, h = L.load.h, c = this.crane, lc = this.loadC;
    const attachHy = GY - h - SL - 30;
    SFX.motor(1.6);
    await this.tw({ targets: c, hy: attachHy, duration: 600, ease: 'Sine.easeInOut' });
    SFX.clack();
    this.attached = true;
    await this.tw({ targets: c, hy: attachHy - 120, duration: 900, ease: 'Sine.easeInOut' });
    await this.tw({ targets: c, tx: c.tx + 7, duration: 70, yoyo: true, repeat: 3 });
    SFX.whistle();
    this.attached = false; this.snapped = true;
    this.tweens.add({ targets: c, hy: attachHy - 190, duration: 500, ease: 'Back.easeOut' });
    this.tweens.add({ targets: lc, angle: 9, duration: 360, ease: 'Quad.easeIn' });
    await this.tw({ targets: lc, y: GY, duration: 360, ease: 'Quad.easeIn' });
    this.crash(lc.x, L.load.w, h, word);
    this.tweens.add({ targets: lc, angle: 0, duration: 300, ease: 'Back.easeOut' });
    await this.tw({ targets: lc, y: GY - 16, duration: 130, yoyo: true, ease: 'Quad.easeOut' });
    lc.y = GY;
    await this.wait(1000);
    this.tweens.add({ targets: c, hy: 190, duration: 500 });
    await this.wait(250);
  }

  crash(x, w, h, word) {
    SFX.crunch();
    if (!reduceMotion) this.cameras.main.shake(260, 0.012);
    for (let i = 0; i < 12; i++) {
      const dir = i % 2 ? 1 : -1;
      const p = this.add.circle(x + dir * (w / 2 - 10), GY - 6, 8 + Math.random() * 8, 0x8a8f96, 0.8).setDepth(11);
      this.tweens.add({ targets: p, x: p.x + dir * (30 + Math.random() * 70), y: p.y - Math.random() * 40, scale: 2, alpha: 0, duration: 700 + Math.random() * 300, onComplete: () => p.destroy() });
    }
    const cy = GY - h - 16;
    const stars = [0, 1, 2].map(() => this.add.image(x, cy, 'star').setDepth(12));
    this.tweens.addCounter({
      from: 0, to: 1, duration: 1500,
      onUpdate: (t) => { const v = t.getValue(); stars.forEach((s, i) => { const a = v * Math.PI * 5 + i * 2.09; s.setPosition(x + Math.cos(a) * 44, cy + Math.sin(a) * 10); }); },
      onComplete: () => stars.forEach((s) => s.destroy()),
    });
    const t = this.add.text(x, cy - 50, word, {
      fontFamily: '"Saira Stencil One", Impact, sans-serif', fontSize: '52px', color: '#f5b800',
      stroke: '#0f141a', strokeThickness: 10,
    }).setOrigin(0.5).setDepth(20).setScale(0.2).setAngle(-6);
    this.tweens.add({ targets: t, scale: 1, duration: 280, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, alpha: 0, delay: 1000, duration: 300, onComplete: () => t.destroy() });
  }

  onExit() {
    if (!this.solved || S.mode !== 'play') return;
    S.mode = 'done';
    this.physics.pause();
    this.player.anims.stop(); this.player.setTexture('r_idle');
    if (this.li === LEVELS.length - 1) { SFX.fanfare(); UI.certified(restartAll); }
    else { SFX.jingle(); UI.levelDone(this.li, () => goLevel(this.li + 1)); }
  }

  respawn() {
    const p = this.player;
    let x = 60;
    this.segments.forEach(([a]) => { if (a < p.x) x = a + 40; });
    SFX.fall();
    p.setPosition(x, GY - 60); p.setVelocity(0, 0);
    this.tweens.add({ targets: p, alpha: 0.2, duration: 90, yoyo: true, repeat: 3 });
  }

  drawCrane() {
    const g = this.hookG, c = this.crane, L = this.L;
    if (this.attached) { this.loadC.x = c.tx - this.cogShift; this.loadC.y = c.hy + 30 + SL + L.load.h; }
    g.clear();
    g.fillStyle(0x2a2f36); g.fillRect(c.tx - 14, 96, 28, 10);
    g.lineStyle(2, 0x151a1f); g.lineBetween(c.tx - 4, 106, c.tx - 4, c.hy); g.lineBetween(c.tx + 4, 106, c.tx + 4, c.hy);
    g.fillStyle(0xf5b800); g.fillRect(c.tx - 11, c.hy, 22, 16);
    g.fillStyle(0x151a1f); g.fillRect(c.tx - 11, c.hy + 6, 22, 3);
    g.lineStyle(4, 0x3a4048); g.beginPath(); g.arc(c.tx, c.hy + 22, 6, 0, Math.PI, false); g.strokePath();
    const hb = c.hy + 28;
    if (this.attached) {
      const lc = this.loadC, top = lc.y - L.load.h;
      g.lineStyle(4, L.load.sling);
      if (L.load.legs === 1) g.lineBetween(c.tx, hb, lc.x, top);
      else { const dx = L.load.w * 0.36; g.lineBetween(c.tx, hb, lc.x - dx, top); g.lineBetween(c.tx, hb, lc.x + dx, top); }
      if (L.id === 3 && this.good) {
        const ex = lc.x - L.load.w / 2 + 6, ey = lc.y - L.load.h / 2;
        g.lineStyle(2, 0xe8d9b0); g.lineBetween(ex, ey, ex - 60, Math.min(GY - 4, ey + 150));
      }
      if (L.load.sleeves && this.good && L.load.legs === 2) {
        const dx = L.load.w * 0.36;
        g.fillStyle(0x14181d); g.fillRect(lc.x - dx - 8, top - 4, 16, 10); g.fillRect(lc.x + dx - 8, top - 4, 16, 10);
      }
    } else if (this.snapped) {
      g.lineStyle(4, L.load.sling);
      g.lineBetween(c.tx, hb, c.tx - 8, hb + 18); g.lineBetween(c.tx, hb, c.tx + 10, hb + 14);
    }
  }

  update(t, dt) {
    this.drawCrane();
    if (S.mode !== 'play') return;
    const p = this.player, b = p.body, k = this.keys, JD = Phaser.Input.Keyboard.JustDown;
    const left = k.left.isDown || k.a.isDown || touch.left;
    const right = k.right.isDown || k.d.isDown || touch.right;
    const onGround = b.blocked.down || b.touching.down;
    this.coyote = onGround ? 100 : this.coyote - dt;
    const hit = JD(k.space) || JD(k.up) || JD(k.w) || touch.jumpQueued;
    touch.jumpQueued = false;
    this.jumpBuf = hit ? 120 : this.jumpBuf - dt;
    if (this.jumpBuf > 0 && this.coyote > 0) { p.setVelocityY(-640); this.jumpBuf = 0; this.coyote = 0; SFX.jump(); }
    const held = k.space.isDown || k.up.isDown || k.w.isDown || touch.jump;
    if (!held && b.velocity.y < -260) p.setVelocityY(-260);

    const vx = (right ? 1 : 0) - (left ? 1 : 0);
    p.setVelocityX(vx * 240);
    if (vx) p.setFlipX(vx < 0);
    if (!onGround) { p.anims.stop(); p.setTexture('r_jump'); }
    else if (vx) p.anims.play('run', true);
    else { p.anims.stop(); p.setTexture('r_idle'); }

    if (p.y > 600) this.respawn();
  }
}

/* ---------- FLOW ---------- */
function goLevel(n) {
  S.level = n;
  S.mode = 'play';
  UI.close();
  UI.hud();
  yard().scene.restart({ level: n });
}
function restartAll() {
  S.score = 0; S.firstTry = [];
  goLevel(0);
}

/* ---------- TOUCH ---------- */
function bindHold(el, key) {
  const on = (e) => { e.preventDefault(); touch[key] = true; if (key === 'jump') touch.jumpQueued = true; el.classList.add('on'); };
  const off = () => { touch[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, off));
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
if (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
bindHold($('tLeft'), 'left'); bindHold($('tRight'), 'right'); bindHold($('tJump'), 'jump');

/* ---------- SOUND WIRING ---------- */
// Browsers allow audio only after a tap or key press.
['pointerdown', 'keydown'].forEach((t) => document.addEventListener(t, () => SFX.init(), { passive: true }));
$('muteBtn').addEventListener('click', (e) => { SFX.init(); SFX.toggle(); e.currentTarget.blur(); });
document.addEventListener('keydown', (e) => { if ((e.key === 'm' || e.key === 'M') && !e.repeat) SFX.toggle(); });

/* ---------- BOOT ---------- */
function start(data) {
  if (data && Number.isInteger(data.level)) { S.level = data.level; S.score = data.score || 0; S.firstTry = data.firstTry || []; }
  const fontsReady = Promise.race([
    Promise.all([document.fonts.load('20px "Saira Stencil One"'), document.fonts.load('15px "Chakra Petch"')]),
    new Promise((r) => setTimeout(r, 2500)),
  ]).catch(() => {});
  fontsReady.then(() => {
    game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: 960, height: 540,
      backgroundColor: '#0d1620',
      physics: { default: 'arcade', arcade: { gravity: { y: 1500 }, debug: false } },
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      render: { roundPixels: true },
      scene: [YardScene],
    });
    S.mode = 'title';
    UI.hud();
    UI.title(() => { S.mode = 'play'; UI.close(); const s = yard(); if (s) s.setUiOpen(false); });
  });
}
try { window.claude?.hot?.snapshot?.(() => ({ level: S.level, score: S.score, firstTry: S.firstTry })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
